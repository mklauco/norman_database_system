name: Deploy

on:
  push:
    branches: [main]
  # Lets a failed or interrupted deploy be retried from the Actions tab
  # without pushing an empty commit to main.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-hour default. On 2026-09-04 a
    # dead SSH connection held this workflow (and the concurrency group)
    # hostage for two hours. Deploys normally finish in 1-3 minutes, 8 with
    # cold composer/npm caches, so 20 is already generous.
    timeout-minutes: 20
    environment:
      name: production

    steps:
      - name: Checkout (for ref only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
            chmod 644 ~/.ssh/known_hosts
          else
            ssh-keyscan -4 -p "${{ secrets.DEPLOY_SSH_PORT || '22' }}" -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          # Keepalives: a silently dropped connection must surface as an error
          # within ~1 minute instead of blocking on a dead socket forever.
          cat > ~/.ssh/config <<'SSHCFG'
          Host *
            AddressFamily inet
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 4
            TCPKeepAlive yes
            StrictHostKeyChecking yes
          SSHCFG
          chmod 600 ~/.ssh/config

      # The deploy script runs detached (setsid) on the server and writes its
      # progress to a log file. A dropped SSH connection can therefore no longer
      # kill a half-finished deploy - the runner just reconnects and keeps
      # reading the log.
      - name: Launch remote deploy
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
              -p "$DEPLOY_SSH_PORT" \
              "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
              GIT_SHA="$GIT_SHA" GIT_REF="$GIT_REF" bash -s <<'LAUNCH'
          set -euo pipefail

          RUN_DIR="/opt/projects/norman_database_system/shared/deploy-runs"
          mkdir -p "$RUN_DIR"
          find "$RUN_DIR" -type f -mtime +30 -delete 2>/dev/null || true

          SCRIPT="$RUN_DIR/$GIT_SHA.sh"
          LOG="$RUN_DIR/$GIT_SHA.log"
          rm -f "$LOG" "$RUN_DIR/$GIT_SHA.status"

          cat > "$SCRIPT" <<'DEPLOY'
          set -euo pipefail

          PROJECT_ROOT="/opt/projects/norman_database_system"
          REPO_URL="https://github.com/mklauco/norman_database_system.git"
          KEEP_RELEASES=5

          RUN_DIR="$PROJECT_ROOT/shared/deploy-runs"
          STATUS="$RUN_DIR/$GIT_SHA.status"

          # If anything below dies, never leave production sitting in maintenance mode.
          # The 2026-09-04 outage hung between `artisan down` and the symlink swap.
          on_failure() {
            code=$?
            echo "DEPLOY FAILED at line $1 (exit $code) - lifting maintenance mode"
            docker exec nds-app php artisan up || true
            echo "FAIL line=$1 exit=$code" > "$STATUS"
            exit "$code"
          }
          trap 'on_failure $LINENO' ERR

          cd "$PROJECT_ROOT"

          # ---- preflight ------------------------------------------------------
          [[ -L current ]]      || { echo "current/ symlink missing — bootstrap not run?"; exit 1; }
          [[ -d shared ]]       || { echo "shared/ missing — bootstrap not run?";          exit 1; }
          [[ -f shared/.env ]]  || { echo "shared/.env missing — fix before deploying.";   exit 1; }

          # Refuse to proceed if disk is nearly full (need ~500 MB headroom for a release)
          available_kb=$(df -Pk "$PROJECT_ROOT" | awk 'NR==2 {print $4}')
          if (( available_kb < 500000 )); then
            echo "Only $((available_kb / 1024)) MB free at $PROJECT_ROOT — need at least 500 MB. Prune old releases manually."
            exit 1
          fi

          # ---- 1. clone fresh release ----------------------------------------
          RELEASE_NAME="$(date +%Y%m%d_%H%M%S)_${GIT_SHA:0:7}"
          RELEASE_PATH="releases/$RELEASE_NAME"
          echo "::group::Clone release $RELEASE_NAME"
          git clone --depth=1 --branch "$GIT_REF" "$REPO_URL" "$RELEASE_PATH"
          cd "$RELEASE_PATH"
          # Refuse to deploy a commit other than the one this run is for. A merge
          # landing on main while this clone runs would otherwise ship code the
          # pipeline never checked, and every later assertion would still pass.
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$GIT_SHA" ]]; then
            echo "Cloned $ACTUAL_SHA but this deploy is for $GIT_SHA."
            echo "Origin moved during the clone; aborting so the next run deploys it cleanly."
            exit 1
          fi
          cd "$PROJECT_ROOT"
          echo "::endgroup::"

          # ---- 2. link shared resources --------------------------------------
          echo "::group::Link shared resources"
          ln -sfn "$PROJECT_ROOT/shared/.env"     "$RELEASE_PATH/.env"
          rm -rf "$RELEASE_PATH/storage"
          ln -sfn "$PROJECT_ROOT/shared/storage"  "$RELEASE_PATH/storage"
          echo "::endgroup::"

          # ---- 3. install dependencies & build assets (in app container) -----
          # We run inside the existing nds-app container so PHP/Node versions
          # match production exactly. Container path /var/www maps to the
          # CURRENT release; we cd into the new release via its host-relative
          # path. Bind mount of $PROJECT_ROOT lets us reach it.
          #
          # Trick: containers mount ./current → /var/www. The new release isn't
          # current yet, but it IS visible at /var/www/../releases/<name>
          # because the bind mount is of the parent dir's symlink target.
          # Safer approach: docker run a fresh ephemeral container with the new
          # release bind-mounted directly.
          # The ephemeral containers must also see $PROJECT_ROOT/shared at the
          # absolute path the symlinks point at, otherwise .env and storage/
          # are dangling and Laravel boot fails.
          echo "::group::composer install (--no-dev)"
          docker run --rm \
            -v "$PROJECT_ROOT/$RELEASE_PATH:/var/www" \
            -v "$PROJECT_ROOT/shared:$PROJECT_ROOT/shared" \
            -w /var/www \
            --user "$(id -u):$(id -g)" \
            laravel-app \
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          echo "::endgroup::"

          echo "::group::npm ci && npm run build"
          docker run --rm \
            -v "$PROJECT_ROOT/$RELEASE_PATH:/var/www" \
            -v "$PROJECT_ROOT/shared:$PROJECT_ROOT/shared" \
            -w /var/www \
            --user "$(id -u):$(id -g)" \
            laravel-app \
            sh -c "npm ci && npm run build"
          echo "::endgroup::"

          # ---- 4. maintenance mode ON ----------------------------------------
          echo "::group::php artisan down"
          docker exec nds-app php artisan down --render="errors::503" --retry=15 || true
          echo "::endgroup::"

          # ---- 5. ATOMIC SWAP ------------------------------------------------
          echo "::group::Atomic symlink swap"
          PREVIOUS_RELEASE="$(readlink current)"
          ln -sfn "$RELEASE_PATH" current
          echo "current -> $RELEASE_PATH (previous: $PREVIOUS_RELEASE)"
          echo "::endgroup::"

          # ---- 6. RECREATE CONTAINERS so they bind the new release -----------
          # Docker resolves bind-mount sources at container-create time and
          # binds by inode, so the symlink swap in step 5 is invisible to the
          # already-running containers — they continue to serve the previous
          # release. `restart` does NOT help (same container, same resolved
          # mount); `up -d` alone is a no-op (compose config unchanged); only
          # `--force-recreate` rebinds. This rolls all app/worker/web containers
          # to the new release. Brief downtime is masked by maintenance mode
          # (step 4) — users see the 503 page, not connection refused.
          echo "::group::Recreate containers against new release"
          docker compose up -d --force-recreate \
            app \
            task-app-schedule \
            task-app-queue-default \
            task-app-queue-medium \
            task-app-queue-exports \
            webserver
          echo "::endgroup::"

          # ---- 7. rebuild Laravel caches against new code --------------------
          # view:clear must run first: compiled Blade views live in
          # shared/storage/framework/views/, which persists across deploys.
          # Stale .php files can reference classes that no longer exist after
          # a package bump (e.g. Livewire upgrade) → 500 on the first request
          # that hits an affected template.
          echo "::group::artisan view:clear + optimize"
          docker exec nds-app php artisan view:clear
          docker exec nds-app php artisan optimize:clear
          docker exec nds-app php artisan optimize
          echo "::endgroup::"

          # ---- 8. regenerate gitignored public/ artefacts ---------------------
          # Both public/storage and public/docs are gitignored, so the fresh
          # `git clone` in step 1 cannot carry them — every release starts
          # without them and they must be rebuilt here.
          #   storage:link → public/storage symlink into shared/storage/app/public;
          #                  without it every user-facing file 404s at nginx level.
          #   scribe:generate → public/docs static site; Scribe runs in 'static'
          #                  mode (config/scribe.php), so /docs is a plain file,
          #                  NOT a Laravel route. Without it /docs 404s.
          # Response calls are disabled in config/scribe.php, so generation makes
          # no live API calls and writes nothing to the database.
          echo "::group::artisan storage:link + scribe:generate"
          docker exec nds-app php artisan storage:link --force
          docker exec nds-app php artisan scribe:generate
          echo "::endgroup::"

          # ---- 9. maintenance mode OFF ---------------------------------------
          echo "::group::php artisan up"
          docker exec nds-app php artisan up
          echo "::endgroup::"

          # ---- 10. prune old releases ----------------------------------------
          echo "::group::Prune old releases (keeping last $KEEP_RELEASES)"
          active_canonical="$(readlink -f "$PROJECT_ROOT/current")"
          cd "$PROJECT_ROOT/releases"
          ls -1tr | head -n -"$KEEP_RELEASES" | while read -r old; do
            # Never delete the initial release or the active one (canonical-path compare)
            if [[ "$old" == "initial" ]]; then continue; fi
            candidate_canonical="$(readlink -f "$PROJECT_ROOT/releases/$old")"
            if [[ "$candidate_canonical" == "$active_canonical" ]]; then continue; fi
            echo "Removing old release: $old"
            rm -rf -- "$old"
          done
          echo "::endgroup::"

          echo ""
          echo "Deploy succeeded: $RELEASE_NAME"

          # ---- 11. assert production really is running this commit ------------
          # Check the commit in the deployed tree, not the release directory
          # name: the name is built from GIT_SHA and would match even if the
          # directory held different code.
          ACTIVE="$(readlink "$PROJECT_ROOT/current")"
          DEPLOYED_SHA="$(git -C "$PROJECT_ROOT/current" rev-parse HEAD)"
          echo "current -> $ACTIVE ($DEPLOYED_SHA)"
          if [[ "$DEPLOYED_SHA" != "$GIT_SHA" ]]; then
            echo "Production is running $DEPLOYED_SHA, expected $GIT_SHA"
            exit 1
          fi

          echo "OK" > "$STATUS"
          DEPLOY

          setsid nohup env GIT_SHA="$GIT_SHA" GIT_REF="$GIT_REF" \
            bash "$SCRIPT" > "$LOG" 2>&1 < /dev/null &
          echo "Launched deploy of $GIT_SHA (log: $LOG)"
          LAUNCH

      - name: Stream remote deploy until it finishes
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          RUN_DIR="/opt/projects/norman_database_system/shared/deploy-runs"
          LOG="$RUN_DIR/$GIT_SHA.log"
          STATUS="$RUN_DIR/$GIT_SHA.status"
          SENT=0
          DEADLINE=$(( SECONDS + 900 ))

          while (( SECONDS < DEADLINE )); do
            out="$(ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" \
                     "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
                     "tail -n +$((SENT + 1)) '$LOG' 2>/dev/null; \
                      echo '@@STATUS@@'; cat '$STATUS' 2>/dev/null || echo RUNNING")" || {
              echo "(poll failed, retrying in 15s)"
              sleep 15
              continue
            }

            new="${out%@@STATUS@@*}"
            status="${out##*@@STATUS@@}"

            if [ -n "$new" ]; then
              printf '%s' "$new"
              SENT=$(( SENT + $(printf '%s' "$new" | grep -c '') ))
            fi

            case "$status" in
              *OK*)   echo "Remote deploy finished successfully."; exit 0 ;;
              *FAIL*) echo "Remote deploy failed:$status"; exit 1 ;;
            esac
            sleep 10
          done

          echo "Timed out after 15 minutes waiting for the remote deploy."
          exit 1

      - name: Verify production is serving this commit
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          read -r active deployed <<<"$(ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" \
                      "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
                      'cd /opt/projects/norman_database_system \
                       && echo "$(readlink current) $(git -C current rev-parse HEAD)"')"
          echo "current -> $active ($deployed)"
          if [[ "$deployed" != "$GIT_SHA" ]]; then
            echo "Production is running $deployed, expected $GIT_SHA."
            exit 1
          fi
