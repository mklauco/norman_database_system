# Production Docker Compose for NORMAN Database System
#
# This file is for the server only. Local development uses docker-compose.yml.
#
# It mounts ./current (atomic-swappable symlink) instead of ./, so deploys can
# atomically point all containers at a new release without restarting them.
#
# Bootstrap script copies this file to /opt/projects/norman_database_system/docker-compose.yml
# on the server. After bootstrap, this file in the repo is for reference only —
# changes to it require a manual sync to the server.

services:

  app:
    build:
      context: ./current
      dockerfile: Dockerfile
    image: laravel-app
    container_name: nds-app
    restart: unless-stopped
    tty: true
    working_dir: /var/www
    volumes:
      - ./current:/var/www
      - ./current/_php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - mkassets_docker_network

  task-app-schedule:
    build:
      context: ./current
      dockerfile: scheduler.dockerfile
    image: laravel-app-schedule
    command: ["php", "artisan", "schedule:work"]
    container_name: nds-app-schedule
    stop_signal: SIGTERM
    restart: unless-stopped
    tty: true
    volumes:
      - ./current:/var/www
      - ./current/_php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - mkassets_docker_network

  task-app-queue-default:
    build:
      context: ./current
      dockerfile: scheduler.dockerfile
    image: laravel-app-queue
    command: ["php", "artisan", "queue:work", "--queue=default,high", "--timeout=300", "--memory=256", "--sleep=1", "--tries=3", "--max-jobs=100", "--rest=5"]
    container_name: nds-app-queue-default
    stop_signal: SIGTERM
    restart: unless-stopped
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[q]ueue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./current:/var/www
      - ./current/_php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - mkassets_docker_network

  task-app-queue-exports:
    build:
      context: ./current
      dockerfile: scheduler.dockerfile
    image: laravel-app-queue-exports
    command: ["php", "artisan", "queue:work", "--queue=exports", "--timeout=7200", "--memory=1024", "--sleep=3", "--tries=2", "--max-jobs=1", "--rest=10"]
    container_name: nds-app-queue-exports
    stop_signal: SIGTERM
    restart: unless-stopped
    tty: true
    environment:
      - PHP_MEMORY_LIMIT=1536M
      - PHP_MAX_EXECUTION_TIME=7200
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 2
      start_period: 60s
    volumes:
      - ./current:/var/www
      - ./current/_php/export-worker.ini:/usr/local/etc/php/conf.d/export-worker.ini
    networks:
      - mkassets_docker_network

  task-app-queue-medium:
    build:
      context: ./current
      dockerfile: scheduler.dockerfile
    image: laravel-app-queue-medium
    command: ["php", "artisan", "queue:work", "--queue=medium", "--timeout=900", "--memory=512", "--sleep=2", "--tries=3", "--max-jobs=50", "--rest=5"]
    container_name: nds-app-queue-medium
    stop_signal: SIGTERM
    restart: unless-stopped
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' || exit 1"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 30s
    volumes:
      - ./current:/var/www
      - ./current/_php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - mkassets_docker_network

  webserver:
    image: nginx:alpine
    container_name: nds-webserver
    restart: unless-stopped
    tty: true
    environment:
      - VIRTUAL_HOST=nds.mkassets.sk,norman-databases.org,www.norman-databases.org
      - LETSENCRYPT_HOST=nds.mkassets.sk,norman-databases.org,www.norman-databases.org
    volumes:
      - ./current:/var/www
      - ./current/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - mkassets_docker_network

networks:
  mkassets_docker_network:
    external: true
